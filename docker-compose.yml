# Um compose só. O lado vem do .env: COMPOSE_PROFILES=dev ou COMPOSE_PROFILES=prod
# (copie o .env.example). O comando é sempre o mesmo:
#
#   docker compose up -d --build
#
# dev  - Vite com recarga (porta 6100) e a API com --watch, o código montado do disco.
# prod - um container só: a imagem do Dockerfile.prod, com o front compilado servido
#        pela própria API (porta 6100), sem recarga e com restart sozinho.
# Os dois usam o mesmo volume obras-data: banco, anexos e o segredo da sessão.
services:
  web:
    profiles: [dev]
    container_name: obras-dev
    image: obras-dev
    build: ./web
    ports:
      - "6100:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api

  api:
    profiles: [dev]
    container_name: obras-api
    build: ./api
    volumes:
      - ./api:/app
      - /app/node_modules
      - obras-data:/data
    # --experimental-sqlite: node:sqlite ainda é experimental no Node 22 (só o flag).
    command: node --experimental-sqlite --watch server.js

  obras:
    profiles: [prod]
    container_name: obras
    image: obras-jean
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "6100:7100"
    # Opcional: sem ele, um aleatório é gerado e guardado em /data/segredo.
    environment:
      - OBRAS_SEGREDO
    volumes:
      - obras-data:/data

volumes:
  obras-data:
