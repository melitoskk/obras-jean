# Produção (a VPS). Um container só: a API serve as telas. O docker-compose.yml é o de
# desenvolvimento (Vite com recarga + API com --watch) e continua como está.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# OBRAS_SEGREDO é opcional: sem ele, um aleatório é gerado e guardado em /data/segredo.
services:
  obras:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: obras-jean
    container_name: obras
    restart: unless-stopped
    ports:
      - "6100:7100"
    environment:
      - OBRAS_SEGREDO
    volumes:
      - obras-data:/data

volumes:
  obras-data:
